name: pos-scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pos-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone core
        run: git clone --depth 1 "https://x-access-token:${{ secrets.GH_PAT }}@github.com/artemjsdx/pos-core.git"

      - name: Install deps
        run: pip install -q aiohttp requests

      - name: Run one cycle
        working-directory: pos-core
        run: python start.py --once --no-banner

      - name: Log tail
        if: always()
        working-directory: pos-core
        run: |
          mkdir -p logs
          tail -n 40 logs/gha_monitor.log 2>/dev/null || echo 'no gha_monitor.log (logger did not create it)'

      - name: Commit state back
        if: always()
        working-directory: pos-core
        run: |
          git config user.name "pos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state update $(date -u +%FT%TZ)"
            git push
          fi
